<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>لعبة المحيبس (عباس كريم)</title><!-- hand-only cinematic rotation v2 --><style>
:root{--gold:#f4c65f}*{box-sizing:border-box}body{margin:0;background:#080e10;color:#ffe3a1;font-family:Tahoma,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;background:linear-gradient(110deg,#28000a,#4a0716);border-bottom:2px solid #b58a36}h1{font-size:clamp(15px,2.4vw,24px);margin:0}button{cursor:pointer;font-family:inherit}header button,.tools button{border:1px solid #d6a64d;background:#320a14;color:#ffe2a0;border-radius:9px;padding:9px 12px;font-weight:bold;font-size:13px}header button:active,.tools button:active{transform:scale(.96)}.tools{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;padding:7px;background:#130609}.status{text-align:center;min-height:24px;font-size:14px;padding:3px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:8px;padding:8px;max-width:1300px;margin:auto;aspect-ratio:2 / 1}.tile{position:relative;perspective:850px;min-width:0;min-height:0;cursor:pointer;touch-action:manipulation}.inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.8,.2,1)}.tile.opened .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid #c69a40;box-shadow:inset 0 0 12px #0008;background-position:center;background-size:100% 100%;overflow:hidden}.back{transform:rotateY(180deg)}.num{position:absolute;right:7px;top:6px;z-index:2;border:1px solid #dcae52;border-radius:50%;background:#23080c;color:#f9d16c;font-weight:bold;font-size:clamp(13px,2.5vw,26px);width:clamp(27px,5vw,48px);height:clamp(27px,5vw,48px);display:grid;place-items:center;box-shadow:0 0 6px #f0c34b}.back .num{right:auto;left:7px;transform:scaleX(-1)}.tile.opened .back .num{transform:scaleX(-1)}.result{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);border-radius:20px;padding:5px 14px;background:#17050bdc;border:1px solid #f0c34b;font-size:clamp(12px,2vw,21px);white-space:nowrap;font-weight:bold;z-index:3}.win .back:after{content:'💍';position:absolute;left:42%;top:35%;font-size:clamp(22px,5vw,58px);filter:drop-shadow(0 0 10px #ffdb3c);animation:pulse 1s infinite alternate}.win .back{box-shadow:inset 0 0 30px #ffd651,0 0 20px #eebd46}.shake{animation:shake .36s}.tile.opened{pointer-events:none}@keyframes pulse{to{transform:scale(1.25) rotate(15deg)}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}.spark{position:fixed;pointer-events:none;z-index:99;font-size:20px;animation:fly .9s ease-out forwards}@keyframes fly{to{opacity:0;transform:translate(var(--x),var(--y)) rotate(90deg) scale(.4)}}.note{text-align:center;font-size:11px;color:#bba782;padding:4px 12px}#secret{display:none;text-align:center;color:#fff;background:#7e1930;border:1px solid #f2c65f;margin:4px auto;padding:8px;max-width:340px;border-radius:10px}#secret.show{display:block}@media(max-width:600px) and (orientation:portrait){.board{gap:3px;padding:4px;aspect-ratio:1.65}.tools{gap:4px}.tools button{padding:7px;font-size:11px}.num{right:2px;top:2px}.result{padding:2px 4px}}@media(orientation:landscape) and (max-height:540px){header{padding:3px 9px}.tools{padding:3px}.tools button{padding:4px 9px}.board{height:calc(100dvh - 112px);width:min(100vw,calc((100dvh - 112px)*2));aspect-ratio:2/1;padding:4px;gap:5px}.status{min-height:18px;padding:0}.note{display:none}}

/* حركة فتح سينمائية: رجّة، تراجع، دوران وكشف */
.tile{filter:drop-shadow(0 3px 5px #0008)}
.tile.revealing{z-index:8;animation:anticipate .52s ease-in-out both}
.tile.revealing .inner{transition:transform 1.18s cubic-bezier(.15,.74,.12,1.03)}
.tile.revealing:before{content:"";position:absolute;inset:-4px;border:2px solid #ffd36a;border-radius:4px;z-index:10;pointer-events:none;animation:glow 1.4s ease-out both}
.tile.opened .back{animation:lightReveal 1.2s ease-out}
@keyframes anticipate{0%{transform:scale(1)}25%{transform:scale(.96) rotate(-1.3deg)}45%{transform:scale(1.035) rotate(1.3deg)}70%{transform:scale(1.055)}100%{transform:scale(1)}}
@keyframes glow{0%{opacity:0;box-shadow:0 0 0 #ffce5d}40%{opacity:1;box-shadow:0 0 24px #ffce5d}100%{opacity:0;box-shadow:0 0 0 #ffce5d}}
@keyframes lightReveal{0%{filter:brightness(.35)}55%{filter:brightness(1.7)}100%{filter:brightness(1)}}
.voice-panel{display:flex;align-items:center;gap:7px;justify-content:center;flex-wrap:wrap;padding:5px;background:#1d0810;border-top:1px solid #604022;font-size:12px}
.voice-panel label{border:1px solid #b58a36;border-radius:7px;padding:6px 9px;cursor:pointer}
.voice-panel input{display:none}
.voice-panel select{background:#300c15;color:#ffe4a1;border:1px solid #b58a36;padding:6px;border-radius:7px}
#voiceInfo{color:#d4c09b}
@media(orientation:landscape) and (max-height:540px){.voice-panel{padding:2px;font-size:10px}.voice-panel label,.voice-panel select{padding:2px}.board{height:calc(100dvh - 135px);width:min(100vw,calc((100dvh - 135px)*2))}}

/* Abbas Karim cinematic hand reveal */
.tile{perspective:1100px;transform-style:preserve-3d;isolation:isolate}
.tile .inner{transform-style:preserve-3d;transition:transform 1.25s cubic-bezier(.16,.75,.18,1)}
.tile.revealing{animation:handAnticipation .62s cubic-bezier(.2,.8,.2,1) both;z-index:3}
.tile.revealing .front{animation:shadowPulse .9s ease-in-out}
.tile.revealing:after{content:'';position:absolute;inset:3%;border:2px solid #f8d277;border-radius:12px;pointer-events:none;box-shadow:0 0 22px #ffc65a, inset 0 0 22px #ffc65a77;animation:goldenPulse 1.5s ease-out both}
.tile.opened .back{animation:revealLight 1.1s ease-out}
.tile.win .back{box-shadow:inset 0 0 55px #f2c654bb,0 0 35px #e6ac40}
@keyframes handAnticipation{0%{transform:scale(1) rotate(0)}25%{transform:scale(.965) rotate(-1deg)}45%{transform:scale(1.025) rotate(1deg)}75%{transform:scale(1.045) rotate(-.5deg)}100%{transform:scale(1) rotate(0)}}
@keyframes goldenPulse{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes shadowPulse{0%{filter:brightness(1)}55%{filter:brightness(.6)}100%{filter:brightness(1.2)}}
@keyframes revealLight{0%{filter:brightness(.55)}40%{filter:brightness(1.6)}100%{filter:brightness(1)}}
@media(prefers-reduced-motion:reduce){.tile.revealing,.tile.revealing .front,.tile.opened .back{animation:none}}

/* تحديث المحيبس: دوران القبضة وحدها 3D — الخلفية والرقم ثابتان */
.tile{perspective:1250px;isolation:isolate;filter:drop-shadow(0 5px 8px #000a)}
.tile .hand-frame{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border:2px solid #ba8a3e;border-radius:13px;background:radial-gradient(ellipse at 48% 40%,#721c24 0%,#4e1019 48%,#240509 100%);box-shadow:inset 0 0 34px #090103,0 5px 16px #0008,0 0 0 1px #f6d78a33;transition:border-color .35s,box-shadow .35s}
.tile .hand-frame:before{content:"";position:absolute;inset:5px;border:1px solid #e2ae55a0;border-radius:9px;pointer-events:none}
.tile .hand-frame:after{content:"✦";position:absolute;left:10px;top:5px;font-size:clamp(10px,2.5vw,19px);color:#dfb65e;text-shadow:0 0 8px #f0c45c9c}
.tile .inner{position:absolute;inset:0;width:100%;height:100%;z-index:2;transform-style:preserve-3d;transition:transform 1.52s cubic-bezier(.17,.72,.18,1.0);will-change:transform;pointer-events:none}
.tile .face{background-size:contain!important;background-position:center!important;background-repeat:no-repeat!important;background-color:transparent!important;border:0!important;box-shadow:none!important;overflow:visible!important;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;filter:drop-shadow(0 11px 8px #0008)}
.tile .front{transform:rotateY(0deg) translateZ(1px)}
.tile .back{transform:rotateY(180deg) translateZ(1px)}
.tile.opened .inner{transform:rotateY(540deg)}
.tile.revealing{z-index:8;animation:none!important}
.tile.revealing .inner{transition:transform 1.52s cubic-bezier(.17,.72,.18,1.0)}
.tile.revealing .front{animation:fistCharge .43s ease-in-out both}
.tile.revealing:before{border-radius:13px;inset:-3px}
.tile.revealing:after{border-radius:13px}
.tile.opened .hand-frame{border-color:#ffd16b;box-shadow:inset 0 0 35px #130205,0 0 13px #f7bc4770}
.tile.win .hand-frame{box-shadow:inset 0 0 36px #3a1315,0 0 22px #eab747}
.tile .num{right:7px;top:7px;left:auto;z-index:10;pointer-events:none;transform:none!important}
.tile .result{bottom:3%;z-index:5;background:#21050fea;box-shadow:0 0 14px #e9b44b99;text-shadow:0 1px 2px #000}
.tile.opened .back{animation:handRevealLight .8s ease-out}
.tile.win .back{box-shadow:none}
@keyframes fistCharge{0%{filter:brightness(1) drop-shadow(0 8px 6px #0008);scale:1}40%{filter:brightness(.73) drop-shadow(0 14px 8px #0009);scale:.92}100%{filter:brightness(1.16) drop-shadow(0 12px 9px #f6c2606b);scale:1.045}}
@keyframes handRevealLight{0%{filter:brightness(.75) drop-shadow(0 8px 8px #0008)}48%{filter:brightness(1.5) drop-shadow(0 0 19px #ffdf8ca8)}100%{filter:brightness(1) drop-shadow(0 11px 8px #0008)}}
@media(max-width:600px) and (orientation:portrait){.tile .num{right:3px;top:3px}.tile .hand-frame{border-radius:7px}.tile .hand-frame:before{inset:3px;border-radius:4px}.tile .result{font-size:clamp(10px,2.3vw,15px);padding:3px 5px}}
@media(prefers-reduced-motion:reduce){.tile .inner,.tile.revealing .inner{transition:none!important}.tile.revealing .front,.tile.opened .back{animation:none!important}}
</style></head><body style="background-image: url('1791702318119.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; margin: 0; height: 100vh;">

const lines={
 start:['يا هلا بأهل المحيبس! يلا نبلّش البات، شدّوا حيلكم!', 'يلا حبايب، بات جديد! وين مخبّي المحيبس؟', 'حي الله الشباب! خلّينا نشوف شطارتكم بهذا البات.', 'يلا أهل الغيرة، المحيبس مخبّى، والذكي يلگاه!'],
 open:['هااا، افتح هاي القبضة، خلّ نشوف!', 'يلا يا بطل، ورّينا هاي العظمة شبيها!', 'هاي العظمة؟ زين، خلّ نشوف شنو بيها!', 'دير بالك، يمكن المحيبس هنا!'],
 miss:['باطل! مو هنا المحيبس، دوّر بعد!', 'أوف، طلعت فارغة! بعد عدنا أمل.', 'هاي ما بيها شي، شدّ حيلك وجرّب غيرها!', 'مو هنانا! لا تستعجل يا بطل.'],
 win:['الله الله! صاد المحيبس! عاشت إيدك يا بطل!', 'هييييه! هذا هو المحيبس! كفو والله!', 'عفية عليك! لكيت المحيبس، تستاهل الفوز!', 'مبروك! ضبطتها، كفو من أهل المحيبس!']
};
const speechSupport=typeof window.speechSynthesis!=='undefined' && typeof window.SpeechSynthesisUtterance!=='undefined';
let arabicVoice=null, voiceReady=false, speechTimer=null;
function voiceBridge(){return window.IraqiVoice || window.AndroidVoice || null}
function chooseArabicVoice(){
 if(!speechSupport)return;
 let voices=[];try{voices=window.speechSynthesis.getVoices()||[]}catch(e){}
 arabicVoice=voices.find(v=>/^ar[-_]IQ$/i.test(v.lang))
  ||voices.find(v=>/^ar[-_]/i.test(v.lang)&&/iraq|عراق/i.test(v.name))
  ||voices.find(v=>/^ar[-_]/i.test(v.lang))
  ||voices.find(v=>/^ar$/i.test(v.lang))||null;
 voiceReady=voices.length>0;
}
if(speechSupport){chooseArabicVoice();try{speechSynthesis.addEventListener('voiceschanged',chooseArabicVoice)}catch(e){}}
let lastSpoken='';
function chooseLine(kind){let candidates=lines[kind]||lines.open;let pick=candidates[Math.floor(Math.random()*candidates.length)];if(pick===lastSpoken&&candidates.length>1)pick=candidates[(candidates.indexOf(pick)+1)%candidates.length];lastSpoken=pick;return pick}
function setVoiceStatus(message){let el=document.getElementById('voiceInfo');if(el)el.textContent=message}
function stopVoice(){
 voiceSequence++;
 if(speechTimer){clearTimeout(speechTimer);speechTimer=null}
 try{voiceBridge()?.stop?.()}catch(e){}
 try{if(speechSupport)speechSynthesis.cancel()}catch(e){}
 try{activeAudio?.pause()}catch(e){}
}
function announce(kind){
 if(!soundOn)return;
 let message=chooseLine(kind);
 stopVoice();const current=voiceSequence;
 // على أندرويد الأصلي: Android TextToSpeech عبر واجهة JS صغيرة في MainActivity.
 let bridge=voiceBridge();
 if(bridge&&typeof bridge.speak==='function'){
  try{bridge.speak(message);setVoiceStatus('🔊 المعلّق العراقي شغّال تلقائياً');return}catch(e){}
 }
 // في Chrome والمتصفحات التي تدعم تحويل النص إلى كلام.
 if(speechSupport){
  try{
   chooseArabicVoice();
   let utterance=new SpeechSynthesisUtterance(message);
   utterance.lang=arabicVoice?.lang||'ar-IQ';
   if(arabicVoice)utterance.voice=arabicVoice;
   utterance.rate=.88;utterance.pitch=.93;utterance.volume=1;
   utterance.onstart=()=>setVoiceStatus('🔊 المعلّق العراقي شغّال تلقائياً');
   utterance.onerror=()=>{if(current===voiceSequence)setVoiceStatus('⚠️ تعذّر تشغيل الصوت؛ تأكد من صوت عربي بالجهاز')};
   speechTimer=setTimeout(()=>{if(current===voiceSequence&&soundOn){try{speechSynthesis.speak(utterance)}catch(e){setVoiceStatus('⚠️ التعليق الصوتي غير مدعوم بهذا المتصفح')}}},50);
   return;
  }catch(e){}
 }
 setVoiceStatus('⚠️ تطبيق APK يحتاج ربط نطق أندرويد حتى يتكلم');
}

function burst(el){let r=el.getBoundingClientRect();for(let i=0;i<20;i++){let s=document.createElement('span');s.className='spark';s.textContent=i%3?'✦':'✨';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',(Math.random()*250-125)+'px');s.style.setProperty('--y',(Math.random()*230-115)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
function openHand(n,el){if(opened.has(n)||document.querySelector('.tile.revealing'))return;opened.add(n);el.classList.add('revealing');fx('open');announce('open');setTimeout(()=>{if(el.isConnected)el.classList.add('opened');},420);setTimeout(()=>{if(!el.isConnected)return;el.classList.remove('revealing');const win=n===target;el.classList.add(win?'win':'miss');el.querySelector('.back').insertAdjacentHTML('beforeend','<span class="result">'+(win?'💍 المحبس هنا!':'❌ باطل')+'</span>');document.getElementById('status').textContent=win?'💍 عاشت إيدك! المحبس بالعظمة '+n:'العظمة '+n+' فارغة، جرّب غيرها';fx(win?'win':'miss');announce(win?'win':'miss');if(win)burst(el);else{el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400)}},1980)}
function newGame(){opened.clear();let a=new Uint32Array(1);if(crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else a[0]=Math.floor(Math.random()*10000);target=a[0]%8+1;hideSecret();document.getElementById('status').textContent='اختار عظمة وافتحها!';let board=document.getElementById('board');board.innerHTML='';order.forEach(n=>{let el=document.createElement('div');el.className='tile';el.innerHTML='<div class="hand-frame" aria-hidden="true"></div><div class="inner"><div class="face front" style="background-image:url('+CLOSED+')"></div><div class="face back" style="background-image:url('+OPEN+')"></div></div><span class="num">'+n+'</span>';el.onclick=()=>openHand(n,el);board.appendChild(el)});fx('open');announce('start')}
function showSecret(){let e=document.getElementById('secret');e.textContent='🔐 المحبس داخل العظمة رقم '+target+' — أخفِ هذا قبل البث!';e.classList.add('show')}
function hideSecret(){document.getElementById('secret').classList.remove('show')}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊 الصوت شغال':'🔇 الصوت مطفي';if(!soundOn){stopVoice();setVoiceStatus('🔇 المعلّق مطفي')}else{setVoiceStatus('🎙️ المعلّق شغّال');announce('start')}}
function testVoice(){announce('start')}

function toggleFullscreen(){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})}
newGame();
</script></body></html>
